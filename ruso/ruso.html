<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russian - Choose Your Path</title>
    <link rel="stylesheet" href="shared-topic.css">
</head>

<body>
    <div class="language-selector">
        <select id="languageSelect">
            <option value="en">🇬🇧 English</option>
            <option value="es">🇪🇸 Español</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="it">🇮🇹 Italiano</option>
            <option value="pt">🇵🇹 Português</option>
            <option value="ru">🇷🇺 Русский</option>
            <option value="zh">🇨🇳 中文</option>
        </select>
    </div>

    <!-- Botón para volver a la página principal de idiomas -->
    <div class="nav-top">
        <div class="btn-home" data-translate="homeButton" data-target="../index.html" role="link" tabindex="0">← Languages</div>
    </div>

    <div class="container">
        <h1 id="mainTitle">Russian</h1>
        <p class="subtitle" id="subtitle">Choose your learning path</p>

        <div class="bubbles-container path-container">
            <!-- Puerta: Autoaprendizaje -->
            <div class="bubble bubble-path" data-target="autoaprendizaje.ru.html" role="link" tabindex="0">
                <div class="bubble-icon">🧭</div>
                <div class="bubble-title" data-translate="selfLearning">Self-Learning</div>
                <div class="bubble-desc" data-translate="selfLearningDesc">Explore all topics freely, at your own pace</div>
            </div>

            <!-- Puerta: Aprendizaje Guiado -->
            <div class="bubble bubble-path" data-target="aprendizaje-guiado.ru.html" role="link" tabindex="0">
                <div class="bubble-icon">🎯</div>
                <div class="bubble-title" data-translate="guidedLearning">Guided Learning</div>
                <div class="bubble-desc" data-translate="guidedLearningDesc">Follow a structured course through every level, step by step</div>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            "en": {
                        "mainTitle": "Russian",
                        "subtitle": "Choose your learning path",
                        "homeButton": "← Languages",
                        "selfLearning": "Self-Learning",
                        "selfLearningDesc": "Explore all topics freely, at your own pace",
                        "guidedLearning": "Guided Learning",
                        "guidedLearningDesc": "Follow a structured course through every level, step by step"
            },
            "es": {
                        "mainTitle": "Ruso",
                        "subtitle": "Elige tu camino de aprendizaje",
                        "homeButton": "← Idiomas",
                        "selfLearning": "Autoaprendizaje",
                        "selfLearningDesc": "Explora todos los temas libremente, a tu propio ritmo",
                        "guidedLearning": "Aprendizaje Guiado",
                        "guidedLearningDesc": "Sigue un curso estructurado por todos los niveles, paso a paso"
            },
            "fr": {
                        "mainTitle": "Russe",
                        "subtitle": "Choisissez votre parcours d'apprentissage",
                        "homeButton": "← Langues",
                        "selfLearning": "Autoformation",
                        "selfLearningDesc": "Explorez tous les sujets librement, à votre rythme",
                        "guidedLearning": "Apprentissage Guidé",
                        "guidedLearningDesc": "Suivez un cours structuré à travers tous les niveaux, étape par étape"
            },
            "de": {
                        "mainTitle": "Russisch",
                        "subtitle": "Wählen Sie Ihren Lernweg",
                        "homeButton": "← Sprachen",
                        "selfLearning": "Selbstlernen",
                        "selfLearningDesc": "Erkunden Sie alle Themen frei, in Ihrem eigenen Tempo",
                        "guidedLearning": "Geführtes Lernen",
                        "guidedLearningDesc": "Folgen Sie einem strukturierten Kurs durch alle Niveaus, Schritt für Schritt"
            },
            "it": {
                        "mainTitle": "Russo",
                        "subtitle": "Scegli il tuo percorso di apprendimento",
                        "homeButton": "← Lingue",
                        "selfLearning": "Autoapprendimento",
                        "selfLearningDesc": "Esplora tutti gli argomenti liberamente, al tuo ritmo",
                        "guidedLearning": "Apprendimento Guidato",
                        "guidedLearningDesc": "Segui un corso strutturato attraverso tutti i livelli, passo dopo passo"
            },
            "pt": {
                        "mainTitle": "Russo",
                        "subtitle": "Escolha seu caminho de aprendizagem",
                        "homeButton": "← Idiomas",
                        "selfLearning": "Autoaprendizagem",
                        "selfLearningDesc": "Explore todos os tópicos livremente, no seu próprio ritmo",
                        "guidedLearning": "Aprendizagem Guiada",
                        "guidedLearningDesc": "Siga um curso estruturado por todos os níveis, passo a passo"
            },
            "ru": {
                        "mainTitle": "Русский",
                        "subtitle": "Выберите свой путь обучения",
                        "homeButton": "← Языки",
                        "selfLearning": "Самостоятельное обучение",
                        "selfLearningDesc": "Изучайте все темы свободно, в своём темпе",
                        "guidedLearning": "Управляемое обучение",
                        "guidedLearningDesc": "Следуйте структурированному курсу через все уровни, шаг за шагом"
            },
            "zh": {
                        "mainTitle": "俄语",
                        "subtitle": "选择你的学习路径",
                        "homeButton": "← 语言",
                        "selfLearning": "自主学习",
                        "selfLearningDesc": "自由探索所有主题，按照自己的节奏",
                        "guidedLearning": "引导式学习",
                        "guidedLearningDesc": "循序渐进地学习结构化课程，逐级提升"
            }
};

        function changeLanguage(lang) {
            const t = translations[lang];

            document.getElementById('mainTitle').textContent = t.mainTitle;
            document.getElementById('subtitle').textContent = t.subtitle;

            document.querySelectorAll('[data-translate]').forEach(element => {
                const key = element.getAttribute('data-translate');
                if (t[key]) {
                    element.textContent = t[key];
                }
            });

            localStorage.setItem('selectedLanguage', lang);
        }

        document.getElementById('languageSelect').addEventListener('change', function () {
            changeLanguage(this.value);
        });

        document.addEventListener('DOMContentLoaded', function () {
            const savedLanguage = localStorage.getItem('selectedLanguage');
            if (savedLanguage) {
                document.getElementById('languageSelect').value = savedLanguage;
                changeLanguage(savedLanguage);
            }
        });

    </script>
    <script src="../nav-links.js"></script>
</body>

</html>
