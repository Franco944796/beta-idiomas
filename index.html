<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trilex — Aprende idiomas</title>
    <link rel="icon" href="imgs/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <script src="ingles/tema.js"></script>
</head>

<body>
    <!-- Header con carrusel -->
    <header class="header">
        <div class="overlay"></div>
        <div class="carousel">
            <div class="carousel-caption">
                <h1 class="carousel-title">
                    <span class="brand">
                        <!-- ∴ («por lo tanto»): el mismo símbolo que el ícono de la pestaña (imgs/favicon.svg) -->
                        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
                            <circle cx="32" cy="15" r="8" />
                            <circle cx="15" cy="45" r="8" />
                            <circle cx="49" cy="45" r="8" />
                        </svg>
                        Trilex
                    </span>
                    <small>Aprende · explora · comunica</small>
                </h1>
            </div>
        </div>

        <!-- tema.js agrega acá el botón de tema claro / oscuro -->
        <div class="ph-actions index-actions"></div>
        <!-- Selector de idiomas -->
        <div class="language-switch">
            <!-- Inglés (disponible) -->
            <div class="lang-item featured" data-target="ingles/ingles.html" role="link" tabindex="0" aria-label="English">
                <img src="imgs/reino-unido.png" alt="Inglés" class="lang-icon">
                <span class="lang-text">English</span>
                <span class="lang-cta">Empezar →</span>
            </div>

            <!-- Alemán (bloqueado) -->
            <div class="lang-item locked" data-lang="de">
                <img src="imgs/alemania.png" alt="Alemán" class="lang-icon">
                <span class="lang-text">Deutsch</span>
                <span class="development-message">Bald verfügbar</span>
            </div>

            <!-- Ruso (bloqueado) -->
            <div class="lang-item locked" data-lang="ru">
                <img src="imgs/rusia.png" alt="Ruso" class="lang-icon">
                <span class="lang-text">Русский</span>
                <span class="development-message">Скоро</span>
            </div>

            <!-- Chino (bloqueado) -->
            <div class="lang-item locked" data-lang="zh">
                <img src="imgs/china.png" alt="Chino" class="lang-icon">
                <span class="lang-text">中文</span>
                <span class="development-message">即将推出</span>
            </div>

            <!-- Castellano (bloqueado) -->
            <div class="lang-item locked" data-lang="es">
                <img src="imgs/argentina.png" alt="Castellano" class="lang-icon">
                <span class="lang-text">Castellano</span>
                <span class="development-message">Próximamente</span>
            </div>
        </div>

        <!-- Contacto -->
        <div class="infos container mb-4 mb-md-2 socials-fixed">
            <div class="socials text-center">
                <div class="row justify-content-between">
                    <div class="col">
                        <h6 class="subtitle font-weight-normal mb-2">Contacto</h6>
                        <div class="social-links">
                            <!-- La dirección se arma en script.js para que no quede escrita en el HTML -->
                            <button type="button" class="link contact-mail" aria-label="Enviar un correo">
                                <span class="contact-icon" aria-hidden="true">✉</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Pie de página con derechos de autor -->
    <footer class="footer">
        <p>&copy; 2025 Trilex. Todos los derechos reservados |
            <span class="footer-link" data-target="terminos.html" role="link" tabindex="0">Términos de uso</span>
        </p>
    </footer>

    <!-- Atribución de iconos de banderas -->
    <div class="attribution">
        <!-- TODO: actualizar el link con la fuente real de imgs/china.png -->
        Iconos de banderas: <a href="https://www.flaticon.es/" target="_blank">Freepik -
            Flaticon</a>
    </div>

    <script src="script.js"></script>
    <script src="nav-links.js"></script>
    <script src="hide-links.js"></script>
</body>

</html>
