<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish - Self-Learning</title>
    <link rel="icon" href="../imgs/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="shared-topic.css">
</head>

<body>
    <div class="language-selector">
        <select id="languageSelect">
            <option value="en">🇬🇧 English</option>
            <option value="es">🇪🇸 Español</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="it">🇮🇹 Italiano</option>
            <option value="pt">🇵🇹 Português</option>
            <option value="ru">🇷🇺 Русский</option>
            <option value="zh">🇨🇳 中文</option>
        </select>
    </div>

    <!-- Botón para volver al selector de ruta -->
    <div class="nav-top">
        <div class="btn-home" data-translate="homeButton" data-target="castellano.html" role="link" tabindex="0">← Spanish</div>
    </div>

    <div class="container">
        <h1 id="mainTitle">Self-Learning</h1>
        <p class="subtitle" id="subtitle">Explore freely, at your own pace</p>

        <div class="placeholder-box">
            <div class="placeholder-box-icon">🚧</div>
            <div class="placeholder-box-title" data-translate="placeholderTitle">Coming Soon</div>
            <div class="placeholder-box-message" data-translate="placeholderMessage">This section is still under development. Check back soon!</div>
        </div>
    </div>

    <script>
        const translations = {
            "en": {
                        "mainTitle": "Self-Learning",
                        "subtitle": "Explore freely, at your own pace",
                        "homeButton": "← Spanish",
                        "placeholderTitle": "Coming Soon",
                        "placeholderMessage": "This section is still under development. Check back soon!"
            },
            "es": {
                        "mainTitle": "Autoaprendizaje",
                        "subtitle": "Explora libremente, a tu propio ritmo",
                        "homeButton": "← Castellano",
                        "placeholderTitle": "Próximamente",
                        "placeholderMessage": "Esta sección todavía está en desarrollo. ¡Volvé pronto!"
            },
            "fr": {
                        "mainTitle": "Autoformation",
                        "subtitle": "Explorez librement, à votre rythme",
                        "homeButton": "← Espagnol",
                        "placeholderTitle": "Bientôt disponible",
                        "placeholderMessage": "Cette section est encore en développement. Revenez bientôt !"
            },
            "de": {
                        "mainTitle": "Selbstlernen",
                        "subtitle": "Erkunden Sie frei, in Ihrem eigenen Tempo",
                        "homeButton": "← Spanisch",
                        "placeholderTitle": "Demnächst verfügbar",
                        "placeholderMessage": "Dieser Bereich befindet sich noch in der Entwicklung. Schauen Sie bald wieder vorbei!"
            },
            "it": {
                        "mainTitle": "Autoapprendimento",
                        "subtitle": "Esplora liberamente, al tuo ritmo",
                        "homeButton": "← Spagnolo",
                        "placeholderTitle": "Prossimamente",
                        "placeholderMessage": "Questa sezione è ancora in fase di sviluppo. Torna presto a trovarci!"
            },
            "pt": {
                        "mainTitle": "Autoaprendizagem",
                        "subtitle": "Explore livremente, no seu próprio ritmo",
                        "homeButton": "← Espanhol",
                        "placeholderTitle": "Em breve",
                        "placeholderMessage": "Esta seção ainda está em desenvolvimento. Volte em breve!"
            },
            "ru": {
                        "mainTitle": "Самостоятельное обучение",
                        "subtitle": "Изучайте свободно, в своём темпе",
                        "homeButton": "← Испанский",
                        "placeholderTitle": "Скоро",
                        "placeholderMessage": "Этот раздел ещё находится в разработке. Загляните позже!"
            },
            "zh": {
                        "mainTitle": "自主学习",
                        "subtitle": "自由探索，按照自己的节奏学习",
                        "homeButton": "← 西班牙语",
                        "placeholderTitle": "即将推出",
                        "placeholderMessage": "此板块仍在开发中，敬请期待！"
            }
};

        function changeLanguage(lang) {
            const t = translations[lang];

            document.getElementById('mainTitle').textContent = t.mainTitle;
            document.getElementById('subtitle').textContent = t.subtitle;

            document.querySelectorAll('[data-translate]').forEach(element => {
                const key = element.getAttribute('data-translate');
                if (t[key]) {
                    element.textContent = t[key];
                }
            });

            localStorage.setItem('selectedLanguage', lang);
        }

        document.getElementById('languageSelect').addEventListener('change', function () {
            changeLanguage(this.value);
        });

        document.addEventListener('DOMContentLoaded', function () {
            const savedLanguage = localStorage.getItem('selectedLanguage');
            if (savedLanguage) {
                document.getElementById('languageSelect').value = savedLanguage;
                changeLanguage(savedLanguage);
            }
        });

    </script>
    <script src="../nav-links.js"></script>
</body>

</html>
