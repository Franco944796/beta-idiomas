<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English - Guided Learning</title>
    <link rel="stylesheet" href="shared-topic.css">
</head>

<body>
    <!-- Selector de idiomas -->
    <div class="language-selector">
        <select id="languageSelect">
            <option value="en">🇬🇧 English</option>
            <option value="es">🇪🇸 Español</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="it">🇮🇹 Italiano</option>
            <option value="pt">🇵🇹 Português</option>
            <option value="ru">🇷🇺 Русский</option>
            <option value="zh">🇨🇳 中文</option>
        </select>
    </div>

    <!-- Botón para volver al selector de ruta -->
    <div class="nav-top">
        <div class="btn-home" data-translate="homeButton" data-target="ingles.html" role="link" tabindex="0">← English</div>
    </div>

    <div class="container">
        <h1 id="mainTitle">Guided Learning</h1>
        <p class="subtitle" id="subtitle">Follow a structured path through every level</p>

        <div class="bubbles-container path-container" style="max-width: 380px;">
            <!-- Burbuja para Curso con Temario -->
            <div class="bubble" data-target="curso.en.html" role="link" tabindex="0">
                <div class="bubble-icon">📚</div>
                <div class="bubble-title" data-translate="course">Course</div>
                <div class="bubble-desc" data-translate="courseDesc">Study all levels</div>
            </div>
        </div>
    </div>

    <!-- Pie de página con atribución -->
    <div class="footer">
        <span data-translate="footerAttribution">Night skyline of London, United Kingdom. Photo by Jesse Collins.</span>
        <span data-translate="licenseText">License:</span>
        <a href="https://unsplash.com/license" target="_blank">Unsplash License</a>
    </div>

    <script>
        const translations = {
            en: {
                mainTitle: "Guided Learning",
                subtitle: "Follow a structured path through every level",
                homeButton: "← English",
                footerAttribution: "Night skyline of London, United Kingdom. Photo by Jesse Collins.",
                licenseText: "License:",
                course: "Course",
                courseDesc: "Study all levels"
            },
            es: {
                mainTitle: "Aprendizaje Guiado",
                subtitle: "Sigue un camino estructurado por todos los niveles",
                homeButton: "← Inglés",
                footerAttribution: "Skyline nocturno de Londres, Reino Unido. Foto de Jesse Collins.",
                licenseText: "Licencia:",
                course: "Curso",
                courseDesc: "Estudia todos los niveles"
            },
            fr: {
                mainTitle: "Apprentissage Guidé",
                subtitle: "Suivez un parcours structuré à travers tous les niveaux",
                homeButton: "← Anglais",
                footerAttribution: "Silhouette nocturne de Londres, Royaume-Uni. Photo de Jesse Collins.",
                licenseText: "Licence:",
                course: "Cours",
                courseDesc: "Étudiez tous les niveaux"
            },
            de: {
                mainTitle: "Geführtes Lernen",
                subtitle: "Folgen Sie einem strukturierten Pfad durch alle Niveaus",
                homeButton: "← Englisch",
                footerAttribution: "Nächtliche Skyline von London, Vereinigtes Königreich. Foto von Jesse Collins.",
                licenseText: "Lizenz:",
                course: "Kurs",
                courseDesc: "Studieren Sie alle Niveaus"
            },
            it: {
                mainTitle: "Apprendimento Guidato",
                subtitle: "Segui un percorso strutturato attraverso tutti i livelli",
                homeButton: "← Inglese",
                footerAttribution: "Skyline notturno di Londra, Regno Unito. Foto di Jesse Collins.",
                licenseText: "Licenza:",
                course: "Corso",
                courseDesc: "Studia tutti i livelli"
            },
            pt: {
                mainTitle: "Aprendizagem Guiada",
                subtitle: "Siga um caminho estruturado por todos os níveis",
                homeButton: "← Inglês",
                footerAttribution: "Skyline noturno de Londres, Reino Unido. Foto de Jesse Collins.",
                licenseText: "Licença:",
                course: "Curso",
                courseDesc: "Estude todos os níveis"
            },
            ru: {
                mainTitle: "Управляемое обучение",
                subtitle: "Следуйте структурированному пути через все уровни",
                homeButton: "← Английский",
                footerAttribution: "Ночной силуэт Лондона, Великобритания. Фото Джесси Коллинза.",
                licenseText: "Лицензия:",
                course: "Курс",
                courseDesc: "Изучайте все уровни"
            },
            zh: {
                mainTitle: "引导式学习",
                subtitle: "循序渐进，逐级学习",
                homeButton: "← 英语",
                footerAttribution: "英国伦敦夜景天际线。摄影：Jesse Collins。",
                licenseText: "许可证:",
                course: "课程",
                courseDesc: "学习所有级别"
            }
        };

        function changeLanguage(lang) {
            const t = translations[lang];

            document.getElementById('mainTitle').textContent = t.mainTitle;
            document.getElementById('subtitle').textContent = t.subtitle;

            document.querySelectorAll('[data-translate]').forEach(element => {
                const key = element.getAttribute('data-translate');
                if (t[key]) {
                    element.textContent = t[key];
                }
            });

            localStorage.setItem('selectedLanguage', lang);
        }

        document.getElementById('languageSelect').addEventListener('change', function () {
            changeLanguage(this.value);
        });

        document.addEventListener('DOMContentLoaded', function () {
            const savedLanguage = localStorage.getItem('selectedLanguage');
            if (savedLanguage) {
                document.getElementById('languageSelect').value = savedLanguage;
                changeLanguage(savedLanguage);
            }
        });
    </script>
    <script src="../nav-links.js"></script>
</body>

</html>
