<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English - Self-Learning</title>
    <link rel="stylesheet" href="shared-topic.css">
</head>

<body>
    <!-- Selector de idiomas -->
    <div class="language-selector">
        <select id="languageSelect">
            <option value="en">🇬🇧 English</option>
            <option value="es">🇪🇸 Español</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="it">🇮🇹 Italiano</option>
            <option value="pt">🇵🇹 Português</option>
            <option value="ru">🇷🇺 Русский</option>
            <option value="zh">🇨🇳 中文</option>
        </select>
    </div>

    <!-- Botón para volver al selector de ruta -->
    <div class="nav-top">
        <a href="ingles.html" class="btn-home" data-translate="homeButton">← English</a>
    </div>

    <div class="container">
        <h1 id="mainTitle">Self-Learning</h1>
        <p class="subtitle" id="subtitle">Explore freely, at your own pace</p>

        <div class="bubbles-container">
            <!-- Burbuja para Textos -->
            <a href="textos.en.html" class="bubble">
                <div class="bubble-icon">📝</div>
                <div class="bubble-title" data-translate="texts">Texts</div>
                <div class="bubble-desc" data-translate="textsDesc">Read and analyze texts in English</div>
            </a>

            <!-- Burbuja para Historia -->
            <a href="historia.en.html" class="bubble">
                <div class="bubble-icon">🏛️</div>
                <div class="bubble-title" data-translate="history">History</div>
                <div class="bubble-desc" data-translate="historyDesc">Discover the history of the U.S.</div>
            </a>

            <!-- Burbuja para Aprendizaje Auditivo -->
            <a href="auditivo.en.html" class="bubble">
                <div class="bubble-icon">🎧</div>
                <div class="bubble-title" data-translate="listening">Listening</div>
                <div class="bubble-desc" data-translate="listeningDesc">Train your ear</div>
            </a>
        </div>
    </div>

    <!-- Pie de página con atribución -->
    <div class="footer">
        <span data-translate="footerAttribution">Urban landscape image of New York, United States.</span>
        <span data-translate="licenseText">License:</span>
        <a href="https://unsplash.com/license" target="_blank">Unsplash License</a>
    </div>

                history: "History",
                historyDesc: "Discover the history of the U.S.",
                listening: "Listening",
                listeningDesc: "Train your ear"
            },
            es: {
                mainTitle: "Autoaprendizaje",
                subtitle: "Explora libremente, a tu propio ritmo",
                homeButton: "← Inglés",
                footerAttribution: "Imagen de paisaje urbano de Nueva York, Estados Unidos.",
                licenseText: "Licencia:",
                texts: "Textos",
                textsDesc: "Lee y analiza textos en inglés",
                history: "Historia",
                historyDesc: "Descubre la historia de EE.UU.",
                listening: "Auditivo",
                listeningDesc: "Entrena tu oído"
            },
            fr: {
                mainTitle: "Autoformation",
                subtitle: "Explorez librement, à votre rythme",
                homeButton: "← Anglais",
                footerAttribution: "Image de paysage urbain de New York, États-Unis.",
                licenseText: "Licence:",
                texts: "Textes",
                textsDesc: "Lisez et analysez des textes en anglais",
                history: "Histoire",
                historyDesc: "Découvrez l'histoire des États-Unis",
                listening: "Écoute",
                listeningDesc: "Entraînez votre oreille"
            },
            de: {
                mainTitle: "Selbstlernen",
                subtitle: "Erkunden Sie frei, in Ihrem eigenen Tempo",
                homeButton: "← Englisch",
                footerAttribution: "Stadtbild von New York, Vereinigte Staaten.",
                licenseText: "Lizenz:",
                texts: "Texte",
                textsDesc: "Lesen und analysieren Sie Texte auf Englisch",
                history: "Geschichte",
                historyDesc: "Entdecken Sie die Geschichte der USA",
                listening: "Hören",
                listeningDesc: "Trainieren Sie Ihr Gehör"
            },
            it: {
                mainTitle: "Autoapprendimento",
                subtitle: "Esplora liberamente, al tuo ritmo",
                homeButton: "← Inglese",
                footerAttribution: "Immagine del paesaggio urbano di New York, Stati Uniti.",
                licenseText: "Licenza:",
                texts: "Testi",
                textsDesc: "Leggi e analizza testi in inglese",
                history: "Storia",
                historyDesc: "Scopri la storia degli Stati Uniti",
                listening: "Ascolto",
                listeningDesc: "Allena il tuo orecchio"
            },
            pt: {
                mainTitle: "Autoaprendizagem",
                subtitle: "Explore livremente, no seu próprio ritmo",
                homeButton: "← Inglês",
                footerAttribution: "Imagem de paisagem urbano de Nova York, Estados Unidos.",
                licenseText: "Licença:",
                texts: "Textos",
                textsDesc: "Leia e analise textos em inglês",
                history: "História",
                historyDesc: "Descubra a história dos EUA",
                listening: "Audição",
                listeningDesc: "Treine seu ouvido"
            },
            ru: {
                mainTitle: "Самостоятельное обучение",
                subtitle: "Изучайте свободно, в своём темпе",
                homeButton: "← Английский",
                footerAttribution: "Изображение городского пейзажа Нью-Йорка, Соединенные Штаты.",
                licenseText: "Лицензия:",
                texts: "Тексты",
                textsDesc: "Читайте и анализируйте тексты на английском",
                history: "История",
                historyDesc: "Откройте для себя историю США",
                listening: "Аудирование",
                listeningDesc: "Тренируйте свой слух"
            },
            zh: {
                mainTitle: "自主学习",
                subtitle: "自由探索，按照自己的节奏学习",
                homeButton: "← 英语",
                footerAttribution: "纽约市城市景观图片，美国。",
                licenseText: "许可证:",
                texts: "文本",
                textsDesc: "阅读和分析英语文本",
                history: "历史",
                historyDesc: "发现美国历史",
                listening: "听力",
                listeningDesc: "训练你的耳朵"
            }
        };

        function changeLanguage(lang) {
            const t = translations[lang];

            document.getElementById('mainTitle').textContent = t.mainTitle;
            document.getElementById('subtitle').textContent = t.subtitle;

            document.querySelectorAll('[data-translate]').forEach(element => {
                const key = element.getAttribute('data-translate');
                if (t[key]) {
                    element.textContent = t[key];
                }
            });

            localStorage.setItem('selectedLanguage', lang);
        }

        document.getElementById('languageSelect').addEventListener('change', function () {
            changeLanguage(this.value);
        });

        document.addEventListener('DOMContentLoaded', function () {
            const savedLanguage = localStorage.getItem('selectedLanguage');
            if (savedLanguage) {
                document.getElementById('languageSelect').value = savedLanguage;
                changeLanguage(savedLanguage);
            }
        });
    </script>
</body>

</html>
